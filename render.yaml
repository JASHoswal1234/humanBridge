services:
  - type: web
    name: humanbridge
    runtime: python
    plan: starter
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: python -m pip install -r backend/requirements.txt && npm --prefix frontend ci --include=dev && npm --prefix frontend run build
    startCommand: python -m uvicorn api:app --app-dir backend --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /api/health
    disk:
      name: humanbridge-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: NODE_VERSION
        value: 22.18.0
      - key: DB_PATH
        value: /var/data/humanbridge.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

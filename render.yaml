services:
  - type: web
    name: humanbridge
    runtime: python
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -r backend/requirements.txt && npm --prefix frontend ci --include=dev && npm --prefix frontend run build
    startCommand: python -m uvicorn api:app --app-dir backend --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: HUMANBRIDGE_FREE_PREVIEW
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: NODE_VERSION
        value: 22.18.0
      - key: DB_PATH
        value: /tmp/humanbridge/humanbridge.db
      - key: UPLOAD_DIR
        value: /tmp/humanbridge/uploads
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
